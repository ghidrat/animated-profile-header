<svg xmlns="http://www.w3.org/2000/svg" width="860" height="230" viewBox="0 0 860 230">
<style>
  .sans{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;} .mono{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;}
  .in{opacity:0;animation:in .9s cubic-bezier(.2,.7,.2,1) forwards;}
  .typed tspan{opacity:0;animation:show .01s linear forwards;}
  .cur{opacity:0;animation:mv 0.96s steps(16) 1.1s forwards, bl 1s step-end 1.1s infinite;}
  .dot{animation:pulse 2.6s ease-in-out infinite;transform-origin:center;transform-box:fill-box;}
  .sweep{animation:sweep 6s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes in{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @keyframes show{to{opacity:1;}}
  @keyframes mv{from{transform:translateX(0);}to{transform:translateX(192px);}}
  @keyframes bl{0%,100%{opacity:1;}50%{opacity:0;}}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  @keyframes sweep{0%{transform:translateX(-30%);}100%{transform:translateX(130%);}}
</style>
<defs>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1f2328"/>
    <stop offset=".6" stop-color="#1f2328"/>
    <stop offset="1" stop-color="#0969da"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" x2="1">
    <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
    <stop offset=".5" stop-color="#8250df"/>
    <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#f6f8fa" stroke-width="1"/>
  </pattern>
  <clipPath id="c"><rect x="1" y="1" width="858" height="228" rx="16"/></clipPath>
  <radialGradient id="glow" cx=".82" cy=".1" r=".7">
    <stop offset="0" stop-color="#8250df" stop-opacity=".10"/>
    <stop offset="1" stop-color="#8250df" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect x="1" y="1" width="858" height="228" rx="16" fill="#ffffff" stroke="#d8dee4"/>
<g clip-path="url(#c)">
  <rect x="0" y="0" width="860" height="230" fill="url(#grid)"/>
  <rect x="0" y="0" width="860" height="230" fill="url(#glow)"/>
  <rect class="sweep" x="0" y="227" width="40%" height="3" fill="url(#rule)"/>
</g>

<g class="in">
  <circle class="dot" cx="48" cy="52" r="4" fill="#1a7f37"/>
  <text x="62" y="57" class="mono" font-size="13" fill="#59636e">ghidrat</text>
  <text x="816" y="57" text-anchor="end" class="mono" font-size="13" fill="#818b98">TypeScript · Python</text>
</g>

<text x="42" y="138" class="sans in" font-size="66" font-weight="700" letter-spacing="-2.5" fill="url(#name)" style="animation-delay:.18s">muriel</text>

<text x="44" y="182" class="mono" font-size="20" fill="#8250df">
  <tspan class="in" style="animation-delay:.5s" fill="#0969da">&gt;&#160;</tspan>
</text>
<text x="68" y="182" class="mono typed" font-size="20" fill="#59636e" textLength="192" lengthAdjust="spacing"><tspan style="animation-delay:1.100s">b</tspan><tspan style="animation-delay:1.160s">a</tspan><tspan style="animation-delay:1.220s">c</tspan><tspan style="animation-delay:1.280s">k</tspan><tspan style="animation-delay:1.340s">e</tspan><tspan style="animation-delay:1.400s">n</tspan><tspan style="animation-delay:1.460s">d</tspan><tspan style="animation-delay:1.520s">&#160;</tspan><tspan style="animation-delay:1.580s">e</tspan><tspan style="animation-delay:1.640s">n</tspan><tspan style="animation-delay:1.700s">g</tspan><tspan style="animation-delay:1.760s">i</tspan><tspan style="animation-delay:1.820s">n</tspan><tspan style="animation-delay:1.880s">e</tspan><tspan style="animation-delay:1.940s">e</tspan><tspan style="animation-delay:2.000s">r</tspan></text>
<rect class="cur" x="69" y="166" width="10.8" height="22" fill="#0969da"/>
</svg>
